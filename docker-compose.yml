version: '3.8'

services:
  # PostgreSQL - Shared database for all services
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: devfoundry
      POSTGRES_PASSWORD: devfoundry
      POSTGRES_DB: devfoundry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devfoundry -d devfoundry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching for ContextForge
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ContextForge - MCP Gateway (Python/FastAPI)
  # This is the IBM/mcp-context-forge project
  contextforge:
    image: ghcr.io/ibm/mcp-context-forge:latest
    environment:
      # Required secrets - must be set before starting
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-default-secret-change-me}
      AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:-default-encrypt-change-me}
      # Basic auth
      BASIC_AUTH_USER: admin
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-admin123}
      # Admin user
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-admin123}
      PLATFORM_ADMIN_FULL_NAME: "Admin User"
      # Database
      DATABASE_URL: postgresql+psycopg://devfoundry:devfoundry@postgres:5432/devfoundry
      # Server config
      HOST: 0.0.0.0
      PORT: 4444
      # Features
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      AUTH_REQUIRED: "true"
      # Security
      SSRF_ALLOW_PRIVATE_NETWORKS: "true"
    ports:
      - "4444:4444"
    volumes:
      - contextforge_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # DevFoundry API - Main orchestrator
  devfoundry-api:
    build:
      context: .
      dockerfile: docker/devfoundry/Dockerfile
    environment:
      # Database
      DATABASE_URL: postgresql://devfoundry:devfoundry@postgres:5432/devfoundry
      # Gateway URLs
      ROUTEFORGE_URL: http://routeforge:8000
      CONTEXFORGE_URL: http://contextforge:4444
      LANGFUSE_URL: http://langfuse:3000
      # Auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-default-secret-change-me}
      # Server
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      contextforge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # DevFoundry Worker
  devfoundry-worker:
    build:
      context: .
      dockerfile: docker/devfoundry/Dockerfile
    command: node dist/worker/index.js
    environment:
      DATABASE_URL: postgresql://devfoundry:devfoundry@postgres:5432/devfoundry
      ROUTEFORGE_URL: http://routeforge:8000
      CONTEXFORGE_URL: http://contextforge:4444
      LANGFUSE_URL: http://langfuse:3000
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      contextforge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Langfuse - Tracing and evaluation (simplified OSS setup)
  langfuse:
    image: langfuse/langfuse:latest
    environment:
      DATABASE_HOST: postgres-langfuse
      DATABASE_USER: langfuse
      DATABASE_PASSWORD: langfuse
      DATABASE_NAME: langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-langfuse-secret}
      AUTH_SECRET: ${AUTH_SECRET:-auth-secret}
    ports:
      - "3001:3000"
    depends_on:
      postgres-langfuse:
        condition: service_healthy

  # Langfuse PostgreSQL
  postgres-langfuse:
    image: postgres:15
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  contextforge_data:
  langfuse_data:
