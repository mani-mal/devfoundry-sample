# ContextForge Configuration

# Registry Configuration
registry:
  enabled: true
  port: 3001
  ttl: 3600

# Tool Approval
tools:
  approval_required: true
  default_timeout: 30000

# Logging
log:
  level: info
  format: json

# MCP Gateway Settings
gateway:
  enabled: true
  max_connections: 100
  rate_limit: 100
