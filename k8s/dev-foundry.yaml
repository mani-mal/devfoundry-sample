# Langfuse Deployment (CPU-only, port 3000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: runai-dev-foundry
  labels:
    app: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: langfuse
          image: langfuse/langfuse:2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              value: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
            - name: DATABASE_HOST
              value: langfuse-postgres
            - name: DATABASE_USER
              value: langfuse
            - name: DATABASE_PASSWORD
              value: langfuse
            - name: DATABASE_NAME
              value: langfuse
            - name: LANGFUSE_ENABLE_CLICKHOUSE_MIGRATION
              value: "false"
            - name: NEXTAUTH_URL
              value: http://langfuse:3000
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: NEXTAUTH_SECRET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: AUTH_SECRET
            - name: SALT
              value: devfoundry-salt-for-langfuse-v2
            - name: LANGFUSE_UI_ENABLED
              value: "true"
            - name: LANGFUSE_API_ENABLED
              value: "true"
            - name: TELEMETRY_ENABLED
              value: "false"
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: runai-dev-foundry
  labels:
    app: langfuse
spec:
  type: ClusterIP
  selector:
    app: langfuse
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Langfuse PostgreSQL StatefulSet (separate DB for Langfuse)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-postgres
  namespace: runai-dev-foundry
  labels:
    app: langfuse-postgres
spec:
  serviceName: langfuse-postgres
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-postgres
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_PASSWORD
              value: langfuse
            - name: POSTGRES_DB
              value: langfuse
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: langfuse-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: langfuse-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: pure-nfs1
        resources:
          requests:
            storage: 10Gi
---
# ClickHouse Deployment for Langfuse V3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-clickhouse-config
  namespace: runai-dev-foundry
data:
  config.xml: |
    <?xml version="1.0"?>
    <clickhouse>
        <listen_host>0.0.0.0</listen_host>
        <logger>
            <level>information</level>
        </logger>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
  namespace: runai-dev-foundry
  labels:
    app: langfuse-clickhouse
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3
          ports:
            - name: http
              containerPort: 8123
            - name: tcp
              containerPort: 9000
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: langfuse-clickhouse-data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            tcpSocket:
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: langfuse-clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: pure-nfs1
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: runai-dev-foundry
  labels:
    app: langfuse-clickhouse
spec:
  type: ClusterIP
  selector:
    app: langfuse-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: tcp
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: runai-dev-foundry
  labels:
    app: langfuse-postgres
spec:
  type: ClusterIP
  selector:
    app: langfuse-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
