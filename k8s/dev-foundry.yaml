---
# DevFoundry Kubernetes Manifests
# Namespace: runai-dev-foundry
# Deployment date: 7 October 2026
---
apiVersion: v1
kind: Namespace
metadata:
  name: runai-dev-foundry
---
# PostgreSQL StatefulSet with PVC
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: runai-dev-foundry
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: devfoundry
            - name: POSTGRES_PASSWORD
              value: devfoundry
            - name: POSTGRES_DB
              value: devfoundry
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: pure-nfs1
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: runai-dev-foundry
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# DevFoundry API Deployment (CPU-only, port 3000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfoundry-api
  namespace: runai-dev-foundry
  labels:
    app: devfoundry-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devfoundry-api
  template:
    metadata:
      labels:
        app: devfoundry-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: devfoundry-api
          image: ghcr.io/mani-mal/dev-foundry-api:v1.1.6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              value: postgresql://devfoundry:devfoundry@postgres:5432/devfoundry
            - name: ROUTEFORGE_URL
              value: http://routeforge:8000
            - name: CONTEXFORGE_URL
              value: http://contextforge:4444
            - name: LANGFUSE_URL
              value: http://langfuse:3000
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: JWT_SECRET_KEY
            - name: PLATFORM_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: PLATFORM_ADMIN_EMAIL
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: PLATFORM_ADMIN_PASSWORD
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: devfoundry-api
  namespace: runai-dev-foundry
  labels:
    app: devfoundry-api
spec:
  type: NodePort
  selector:
    app: devfoundry-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# DevFoundry Worker Deployment (CPU-only)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfoundry-worker
  namespace: runai-dev-foundry
  labels:
    app: devfoundry-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devfoundry-worker
  template:
    metadata:
      labels:
        app: devfoundry-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: devfoundry-worker
          image: ghcr.io/mani-mal/dev-foundry-worker:v1.1.5
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: DATABASE_URL
              value: postgresql://devfoundry:devfoundry@postgres:5432/devfoundry
            - name: ROUTEFORGE_URL
              value: http://routeforge:8000
            - name: CONTEXFORGE_URL
              value: http://contextforge:4444
            - name: LANGFUSE_URL
              value: http://langfuse:3000
            - name: WORKER_ID
              value: worker-1
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: devfoundry-worker
  namespace: runai-dev-foundry
  labels:
    app: devfoundry-worker
spec:
  type: ClusterIP
  selector:
    app: devfoundry-worker
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
# OpenCode Harness Deployment (headless opencode serve, port 4096)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: runai-dev-foundry
  labels:
    app: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: opencode
          image: ghcr.io/sst/opencode:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "opencode serve --port 4096 --hostname 0.0.0.0 --print-logs"]
          ports:
            - name: http
              containerPort: 4096
          workingDir: /workspace
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 4096
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: runai-dev-foundry
  labels:
    app: opencode
spec:
  type: ClusterIP
  selector:
    app: opencode
  ports:
    - name: http
      port: 4096
      targetPort: 4096
---
# ContextForge Deployment (Python/FastAPI, port 4444)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contextforge
  namespace: runai-dev-foundry
  labels:
    app: contextforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contextforge
  template:
    metadata:
      labels:
        app: contextforge
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: contextforge
          image: ghcr.io/mani-mal/devfoundry-contextforge:v1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4444
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: JWT_SECRET_KEY
            - name: AUTH_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: AUTH_ENCRYPTION_SECRET
            - name: BASIC_AUTH_USER
              value: admin
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: BASIC_AUTH_PASSWORD
            - name: PLATFORM_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: PLATFORM_ADMIN_EMAIL
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devfoundry-secrets
                  key: PLATFORM_ADMIN_PASSWORD
            - name: PLATFORM_ADMIN_FULL_NAME
              value: "Admin User"
            - name: DATABASE_URL
              value: postgresql+psycopg://devfoundry:devfoundry@postgres:5432/devfoundry
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4444"
            - name: MCPGATEWAY_UI_ENABLED
              value: "true"
            - name: MCPGATEWAY_ADMIN_API_ENABLED
              value: "true"
            - name: AUTH_REQUIRED
              value: "true"
            - name: SSRF_ALLOW_PRIVATE_NETWORKS
              value: "true"
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: contextforge
  namespace: runai-dev-foundry
  labels:
    app: contextforge
spec:
  type: ClusterIP
  selector:
    app: contextforge
  ports:
    - name: http
      port: 4444
      targetPort: 4444
---
